clip=el('clipPath',{id:uid+'m'},defs);\n  el('rect',{x:L,y:top,width:R-L,height:gridH},clip);\n  /* jednolita mapa ciepła: siatka kolorów (z marginesem z powtórzonych krawędzi), rozmyta → płynne przejścia, przycięta do prostokąta */\n  const g=el('g',{'clip-path':`url(#${uid}m)`},svg),gb=el('g',{filter:`url(#${uid}b)`},g);\n  for(let i=-1;i<=H.length;i++)for(let k=-1;k<=LEV.length;k++){\n    const ii=Math.max(0,Math.min(H.length-1,i)),kk=Math.max(0,Math.min(LEV.length-1,k));\n    el('rect',{x:X(0)+i*step-step/2,y:rowY(k),width:step+.5,height:rowH+.5,fill:wcol(windAt(LEV[kk],ii))},gb)}\n  /* pora przed wschodem / po zachodzie – przyciemnienie */\n  const xt=t=>X(0)+(t-H[0])*step;\n  const sr=Math.min(R,xt(hf(DATA.sunrise))),ss=Math.max(L,xt(hf(DATA.sunset)));\n  if(sr>L)el('rect',{x:L,y:top,width:sr-L,height:gridH,fill:'var(--bg)',opacity:.4},svg);\n  if(ss<R)el('rect',{x:ss,y:top,width:R-ss,height:gridH,fill:'var(--bg)',opacity:.4},svg);\n  /* oś wysokości co 20 m + znacznik limitu 120 m */\n  LEV.forEach((a,k)=>{if(a%20===0||a===120){const t=el('text',{x:L-6,y:rowY(k)+rowH/2+4,'text-anchor':'end',...(a===120?{class:'lbl'}:{})},svg);t.textContent=a+'m'}});\n  const k120=LEV.indexOf(120); /* górna krawędź wiersza 120 m = limit wysokości lotu */\n  if(k120>=0){const yl=rowY(k120);\n    el('line',{x1:L,x2:R,y1:yl,y2:yl,stroke:'var(--text)','stroke-width':1.2,'stroke-dasharray':'3 3',opacity:.55},svg)}\n  /* kierunek i porywy pod mapą */\n  const lbA=el('text',{x:L-6,y:yArr+5,'text-anchor':'end',style:'font-size:10px'},svg);lbA.textContent='kier.';\n  const lbG=el('text',{x:L-6,y:yG+4,'text-anchor':'end',style:'font-size:10px'},svg);lbG.textContent='porywy';\n  H.forEach((hv,i)=>{\n    el('path',{d:'M0,-7L4.5,5L0,2.5L-4.5,5Z',fill:'var(--text2)',transform:`translate(${X(i)},${yArr}) rotate(${(D.dir[i]+180)%360})`},svg);  /* dokąd wieje */\n    const gt=el('text',{x:X(i),y:yG+4,'text-anchor':'middle',class:'lbl',style:(narrow?'font-size:10px;':'')+'fill:'+wcol(D.gust[i]- amię to godzina (od góry, zgodnie z zegarem). Im dalej od środka, tym lepiej widać – skala do 20 km.<\/p>`;\n  const sw=(bg,op,round)=>`<i style=\"width:12px;height:12px;border-radius:${round?'50%':'3px'};background:${bg};opacity:${op};vertical-align:-2px\"><\/i>`;\n  const dot=c=>`<i style=\"width:9px;height:9px;border-radius:50%;background:${c};border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--axis);vertical-align:-1px\"><\/i>`;\n  const lg=document.createElement('div');lg.className='legend';\n  lg.style.cssText='flex-direction:column;gap:9px;margin:0;flex:0 1 auto';\n  lg.innerHTML=[\n    `<span>${sw('var(--crit)',.45,1)}poniżej 1 km – lot odradzany<\/span>`,\n    `<span>${sw('var(--warn)',.4,1)}1–5 km – z uwagą<\/span>`,\n    `<span>${dot('var(--good)')}powyżej 5 km – dobrze<\/span>`,\n    `<span><i style=\"background:var(--s1)\"><\/i>${band?'mediana modeli':'prognoza'}<\/span>`,\n    ...(band?[`<span><svg width=\"16\" height=\"10\" style=\"display:inline-block;width:16px;vertical-align:-1px;margin-right:5px;overflow:visible\"><path d=\"M1 5H15M1 1V9M15 1V9\" stroke=\"var(--text2)\" stroke-width=\"1.4\" fill=\"none\"/><\/svg>rozrzut modeli (min–max)<\/span>`]:[]),\n    `<span>${sw('var(--night)',1,0)}przed wschodem / po zachodzie<\/span>`].join('');\n  /* radar po lewej, legenda po prawej; na wąskim ekranie legenda przechodzi pod wykres */\n  const narrow=W<640,size=narrow?Math.min(W,420):460,h=size+8,cx=size/2,cy=size/2+4,R=size/2-(narrow?36:48);\n  const svg=el('svg',{viewBox:`0 0 ${size} ${h}`,role:'img','aria-label':'Widoczność',style:`width:${size}px;max-width:100%;flex:0 0 auto`});\n  const rr=v=>R*Math.sqrt(Math.max(0,Math.min(v,VMAX))/VMAX);\n  const ang=i=>-Math.PI/2+i*2*Math.PI/n,half=Math.PI/n;\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rr(v),cy+Math.sin(ang(i))*rr(v)];\n  const poly=a=>a.map((v,i)=>{const p=pt(i,v);return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join('')+'Z';\n  const wedge=(i,r)=>{const a0=ang(i)-half,a1=ang(i)+half; =Math.cos(a)*4,[x0,y0]=pt(i,lo),[x1,y1]=pt(i,hi);\n    el('path',{d:`M${x0},${y0}L${x1},${y1}M${x0-px},${y0-py}L${x0+px},${y0+py}M${x1-px},${y1-py}L${x1+px},${y1+py}`,stroke:'var(--text2)','stroke-width':1.4,fill:'none',opacity:.7},svg)});\n  V.forEach((v,i)=>{const p=pt(i,v);el('circle',{cx:p[0],cy:p[1],r:narrow?3.5:4.5,fill:v<1000?'var(--crit)':v<5000?'var(--warn)':'var(--good)',stroke:'var(--surface)','stroke-width':1.5},svg)});\n  /* opisy pierścieni (na ukos, między ramionami) */\n  const la=-Math.PI/2+half;\n  [[1000,'1'],[5000,'5'],[10000,'10'],[20000,'20 km']].forEach(([v,t])=>{\n    const x=cx+Math.cos(la)*rr(v)+3,y=cy+Math.sin(la)*rr(v)+(v===VMAX?11:-3);  /* 20 km – od środka, żeby nie wchodziło na godziny */\n    const tx=el('text',{x,y,style:'font-size:10px',...(v===5000||v===1000?{class:'lbl'}:{})},svg);tx.textContent=t});\n  /* godzina + wartość na zewnątrz */\n  H.forEach((hv,i)=>{const a=ang(i),c=Math.cos(a),s=Math.sin(a),lr=R+(narrow?13:18);\n    const x=cx+c*lr,y=cy+s*lr+(s>0.3?8:s<-0.3?-4:3),anchor=c>0.25?'start':c<-0.25?'end':'middle';\n    const t1=el('text',{x,y,'text-anchor':anchor,class:'lbl',style:narrow?'font-size:10px':''},svg);t1.textContent=String(hv).padStart(2,'0');\n    const v=V[i],t2=el('text',{x,y:y+(narrow?11:13),'text-anchor':anchor,style:'font-size:'+(narrow?'9px':'10.5px')+(v<5000?';fill:'+(v<1000?'var(--crit)':'var(--text2)')+';font-weight:600':'')},svg);\n    t2.textContent=v>=VMAX?'>20':fmt(v/1000,v<10000?1:0)});\n  /* obszary podpowiedzi: wycinek na godzinę */\n  H.forEach((_,i)=>{const r=el('path',{d:wedge(i,R+30),fill:'transparent'},svg);\n    const extra=[['Widoczność (mediana)',visTxt(V[i]),'var(--s1)']];\n    MODELS.forEach(m=>{const mv=m.s.vis&&m.s.vis[i];if(mv!=null)extra.push(['  '+m.name,visTxt(mv),null,true])});\n    r.addEventListener('pointermove',e=>show(i,e,extra));r.addEventListener('pointerleave',hide);r.addEventListener('pointerdown',e=>show(i,e,extra))});\n  const wrap=document.createElement('div');\n  wra e\"><path d=\"M1 5H15M1 1V9M15 1V9\" stroke=\"var(--text2)\" stroke-width=\"1.4\" fill=\"none\"/><\/svg>rozrzut modeli (min–max)<\/span>`]:[]),\n    `<span>${sw('var(--night)',1,0)}przed wschodem / po zachodzie<\/span>`].join('');\n  /* radar po lewej, legenda po prawej; na wąskim ekranie legenda przechodzi pod wykres */\n  const narrow=W<640,size=narrow?Math.min(W,420):460,h=size+8,cx=size/2,cy=size/2+4,R=size/2-(narrow?36:48);\n  const svg=el('svg',{viewBox:`0 0 ${size} ${h}`,role:'img','aria-label':'Widoczność',style:`width:${size}px;max-width:100%;flex:0 0 auto`});\n  const rr=v=>R*Math.sqrt(Math.max(0,Math.min(v,VMAX))/VMAX);\n  const ang=i=>-Math.PI/2+i*2*Math.PI/n,half=Math.PI/n;\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rr(v),cy+Math.sin(ang(i))*rr(v)];\n  const poly=a=>a.map((v,i)=>{const p=pt(i,v);return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join('')+'Z';\n  const wedge=(i,r)=>{const a0=ang(i)-half,a1=ang(i)+half;\n    return `M${cx},${cy}L${cx+Math.cos(a0)*r},${cy+Math.sin(a0)*r}A${r},${r} 0 0 1 ${cx+Math.cos(a1)*r},${cy+Math.sin(a1)*r}Z`};\n  /* godziny przed wschodem / po zachodzie (środek godziny) – szary wycinek, jak na innych wykresach */\n  const sr=hf(DATA.sunrise),ss=hf(DATA.sunset);\n  H.forEach((hv,i)=>{if(hv+.5<sr||hv+.5>ss)el('path',{d:wedge(i,R),fill:'var(--night)'},svg)});\n  /* strefy progów */\n  el('circle',{cx,cy,r:rr(5000),fill:'var(--warn)',opacity:.12},svg);el('circle',{cx,cy,r:rr(5000),fill:'none',stroke:'var(--warn)','stroke-width':1.5,opacity:.8},svg);\n  el('circle',{cx,cy,r:rr(1000),fill:'var(--crit)',opacity:.2},svg);el('circle',{cx,cy,r:rr(1000),fill:'none',stroke:'var(--crit)','stroke-width':1.5,opacity:.9},svg);\n  /* pierścienie i ramiona */\n  [1000,5000,10000,20000].forEach(v=>el('circle',{cx,cy,r:rr(v),fill:'none',stroke:v===20000?'var(--axis)':'var(--grid)','stroke-width':1,...(v<20000?{'stroke-dasharray':'3 3'}:{})},svg));\n  H.forEach((_,i)=>{const p=pt(i,VMAX);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'va ction');card.className='card';\n  card.innerHTML=head('vis','Widoczność (km)',['min.',`${visTxt(V[iMin])} · ${hh(H[iMin])}`,lvl(V[iMin],5000,1000,1)])+\n    `<p>Ramię to godzina (od góry, zgodnie z zegarem). Im dalej od środka, tym lepiej widać – skala do 20 km.<\/p>`;\n  const sw=(bg,op,round)=>`<i style=\"width:12px;height:12px;border-radius:${round?'50%':'3px'};background:${bg};opacity:${op};vertical-align:-2px\"><\/i>`;\n  const dot=c=>`<i style=\"width:9px;height:9px;border-radius:50%;background:${c};border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--axis);vertical-align:-1px\"><\/i>`;\n  const lg=document.createElement('div');lg.className='legend';\n  lg.style.cssText='flex-direction:column;gap:9px;margin:0;flex:0 1 auto';\n  lg.innerHTML=[\n    `<span>${sw('var(--crit)',.45,1)}poniżej 1 km – lot odradzany<\/span>`,\n    `<span>${sw('var(--warn)',.4,1)}1–5 km – z uwagą<\/span>`,\n    `<span>${dot('var(--good)')}powyżej 5 km – dobrze<\/span>`,\n    `<span><i style=\"background:var(--s1)\"><\/i>${band?'mediana modeli':'prognoza'}<\/span>`,\n    ...(band?[`<span><svg width=\"16\" height=\"10\" style=\"display:inline-block;width:16px;vertical-align:-1px;margin-right:5px;overflow:visible\"><path d=\"M1 5H15M1 1V9M15 1V9\" stroke=\"var(--text2)\" stroke-width=\"1.4\" fill=\"none\"/><\/svg>rozrzut modeli (min–max)<\/span>`]:[]),\n    `<span>${sw('var(--night)',1,0)}przed wschodem / po zachodzie<\/span>`].join('');\n  /* radar po lewej, legenda po prawej; na wąskim ekranie legenda przechodzi pod wykres */\n  const narrow=W<640,size=narrow?Math.min(W,420):460,h=size+8,cx=size/2,cy=size/2+4,R=size/2-(narrow?36:48);\n  const svg=el('svg',{viewBox:`0 0 ${size} ${h}`,role:'img','aria-label':'Widoczność',style:`width:${size}px;max-width:100%;flex:0 0 auto`});\n  const rr=v=>R*Math.sqrt(Math.max(0,Math.min(v,VMAX))/VMAX);\n  const ang=i=>-Math.PI/2+i*2*Math.PI/n,half=Math.PI/n;\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rr(v),cy+Math.sin(ang(i))*rr(v)];\n  const poly=a=>a.map((v,i)=>{const p=pt(i,v);return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join('')+'Z';\n  const wedge=(i,r)=>{const a0=ang(i)-half,a1=ang(i)+half;\n    return `M${cx},${cy}L${cx+Math.cos(a0)*r},${cy+Math.sin(a0)*r}A${r},${r} 0 0 1 ${cx+Math.cos(a1)*r},${cy+Math.sin(a1)*r}Z`};\n  /* godziny przed wschodem / po zachodzie (środek godziny) – szary wycinek, jak na innych wykresach */\n  const sr=hf(DATA.sunrise),ss=hf(DATA.sunset);\n  H.forEach((hv,i)=>{if(hv+.5<sr||hv+.5>ss)el('path',{d:wedge(i,R),fill:'var(--night)'},svg)});\n  /* strefy progów */\n  el('circle',{cx,cy,r:rr(5000),fill:'var(--warn)',opacity:.12},svg);el('circle',{cx,cy,r:rr(5000),fill:'none',stroke:'var(--warn)','stroke-width':1.5,opacity:.8},svg);\n  el('circle',{cx,cy,r:rr(1000),fill:'var(--crit)',opacity:.2},svg);el('circle',{cx,cy,r:rr(1000),fill:'none',stroke:'var(--crit)','stroke-width':1.5,opacity:.9},svg);\n  /* pierścienie i ramiona */\n  [1000,5000,10000,20000].forEach(v=>el('circle',{cx,cy,r:rr(v),fill:'none',stroke:v===20000?'var(--axis)':'var(--grid)','stroke-width':1,...(v<20000?{'stroke-dasharray':'3 3'}:{})},svg));\n  H.forEach((_,i)=>{const p=pt(i,VMAX);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'var(--grid)'},svg)});\n  /* rozrzut modeli i mediana */\n  el('path',{d:poly(V),fill:'var(--s1)','fill-opacity':.12,stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round'},svg);\n  if(band)H.forEach((_,i)=>{const lo=Math.min(VR.lo[i],VMAX),hi=Math.min(VR.hi[i],VMAX);if(rr(hi)-rr(lo)<2)return;\n    const a=ang(i),px=-Math.sin(a)*4,py=Math.cos(a)*4,[x0,y0]=pt(i,lo),[x1,y1]=pt(i,hi);\n    el('path',{d:`M${x0},${y0}L${x1},${y1}M${x0-px},${y0-py}L${x0+px},${y0+py}M${x1-px},${y1-py}L${x1+px},${y1+py}`,stroke:'var(--text2)','stroke-width':1.4,fill:'none',opacity:.7},svg)});\n  V.forEach((v,i)=>{const p=pt(i,v);el('circle',{cx:p[0],cy:p[1],r:narrow?3.5:4.5,fill:v<1000?'var(--crit)':v<5000?'var(--warn)':'var(--good)',stroke:'var(--surface)','stroke-width':1.5},svg)});\n  /* opisy pierścieni (na ukos, między ramionami) */\n  const la=-Math.PI/2+half;\n  [[1000,'1'],[5000,'5'],[10000,'10'],[20000,'20 km']].forEach(([v,t])=>{\n    const x=cx+Math.cos(la)*rr(v)+3,y=cy+Math.sin(la)*rr(v)+(v===VMAX?11:-3);  /* 20 km – od środka, żeby nie wchodziło na godziny */\n    const tx=el('text',{x,y,style:'font-size:10px',...(v===5000||v===1000?{class:'lbl'}:{})},svg);tx.textContent=t});\n  /* godzina + wartość na zewnątrz */\n  H.forEach((hv,i)=>{const a=ang(i),c=Math.cos(a),s=Math.sin(a),lr=R+(narrow?13:18);\n    const x=cx+c*lr,y=cy+s*lr+(s>0.3?8:s<-0.3?-4:3),anchor=c>0.25?'start':c<-0.25?'end':'middle';\n    const t1=el('text',{x,y,'text-anchor':anchor,class:'lbl',style:narrow?'font-size:10px':''},svg);t1.textContent=String(hv).padStart(2,'0');\n    const v=V[i],t2=el('text',{x,y:y+(narrow?11:13),'text-anchor':anchor,style:'font-size:'+(narrow?'9px':'10.5px')+(v<5000?';fill:'+(v<1000?'var(--crit)':'var(--text2)')+';font-weight:600':'')},svg);\n    t2.textContent=v>=VMAX?'>20':fmt(v/1000,v<10000?1:0)});\n  /* obszary podpowiedzi: wycinek na godzinę */\n  H.forEach((_,i)=>{const r=el('path',{d:wedge(i,R+30),fill:'transparent'},svg);\n    const extra=[['Widoczność (mediana)',visTxt(V[i]),'var(--s1)']];\n    MODELS.forEach(m=>{const mv=m.s.vis&&m.s.vis[i];if(mv!=null)extra.push(['  '+m.name,visTxt(mv),null,true])});\n    r.addEventListener('pointermove',e=>show(i,e,extra));r.addEventListener('pointerleave',hide);r.addEventListener('pointerdown',e=>show(i,e,extra))});\n  const wrap=document.createElement('div');\n  wrap.style.cssText='display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 40px;padding-bottom:8px';\n  wrap.append(svg,lg);card.appendChild(wrap);document.getElementById('charts').appendChild(card);\n}\nfunction render(){\nif(MULTI())BASER=mrange('base',baseOf);\ndims();document.getElementById('charts').innerHTML='';crosses.length=0;\nwindHeatmap();\n\nvisRadar();\n\n/* siatka 2×2: temperatura, opady, chmury, Kp (na wąs 71-9h1.79a4.5 4.5 0 1 1 0 9Z\"/>',\n  week:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/><path d=\"M7 15h10\"/>',\n  day:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/><rect x=\"7.5\" y=\"13.5\" width=\"4\" height=\"4\" rx=\".6\"/>',\n  grid:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/>',\n  list:'<path d=\"M3 6h.01\"/><path d=\"M3 12h.01\"/><path d=\"M3 18h.01\"/><path d=\"M8 6h13\"/><path d=\"M8 12h13\"/><path d=\"M8 18h13\"/>'};\nconst ico=(k,c='ico')=>`<svg class=\"${c}\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${ICON[k]}<\/svg>`;\n\n/* ---- nagłówek: werdykt, najważniejsze liczby, łuk słońca z ocenami godzin ---- */\n(function hero(){\n  const MON=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];\n  const DAYS=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];\n  const COL={g:'var(--good)',y:'var(--warn)',r:'var(--crit)'};\n  const [dd,mm,yy]=DATA.dateLong.split(' ').pop().split('.').map(Number),dt=new Date(yy,mm-1,dd);\n  const S=DATA.series,Hr=DATA.hours;\n  const win=code=>{const o=[];let c=null;\n    Hr.forEach((h,i)=>{if(S.rate[i]===code){if(!c)c={a:h,b:h,w:[]};c.b=h;DATA.why[i].forEach(x=>{if(!c.w.includes(x))c.w.push(x)})}else if(c){o.push(c);c=null}});\n    if(c)o.push(c);\n    return o.map(x=>{let a=hh(x.a),b=hh(x.b+1);if(a<DATA.dawn)a=DATA.dawn;if(b>DATA.dusk)b=DATA.dusk;return{a,b,w:x.w}})};\n  const g=win('g'),y=win('y'),r=win('r');\n  const code=g.length?'g':y.length?'y':'r',best=code==='g'?g:code==='y'?y:[];\n  document.getElementById('hPlace').innerHTML=`${ico('day')}<span><b>${DATA.place}<\/b><span class=\"sep\ od góry, zgodnie z zegarem). Im dalej od środka, tym lepiej widać – skala do 20 km.<\/p>`;\n  const sw=(bg,op,round)=>`<i style=\"width:12px;height:12px;border-radius:${round?'50%':'3px'};background:${bg};opacity:${op};vertical-align:-2px\"><\/i>`;\n  const dot=c=>`<i style=\"width:9px;height:9px;border-radius:50%;background:${c};border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--axis);vertical-align:-1px\"><\/i>`;\n  const lg=document.createElement('div');lg.className='legend';\n  lg.style.cssText='flex-direction:column;gap:9px;margin:0;flex:0 1 auto';\n  lg.innerHTML=[\n    `<span>${sw('var(--crit)',.45,1)}poniżej 1 km – lot odradzany<\/span>`,\n    `<span>${sw('var(--warn)',.4,1)}1–5 km – z uwagą<\/span>`,\n    `<span>${dot('var(--good)')}powyżej 5 km – dobrze<\/span>`,\n    `<span><i style=\"background:var(--s1)\"><\/i>${band?'mediana modeli':'prognoza'}<\/span>`,\n    ...(band?[`<span><svg width=\"16\" height=\"10\" style=\"display:inline-block;width:16px;vertical-align:-1px;margin-right:5px;overflow:visible\"><path d=\"M1 5H15M1 1V9M15 1V9\" stroke=\"var(--text2)\" stroke-width=\"1.4\" fill=\"none\"/><\/svg>rozrzut modeli (min–max)<\/span>`]:[]),\n    `<span>${sw('var(--night)',1,0)}przed wschodem / po zachodzie<\/span>`].join('');\n  /* radar po lewej, legenda po prawej; na wąskim ekranie legenda przechodzi pod wykres */\n  const narrow=W<640,size=narrow?Math.min(W,420):460,h=size+8,cx=size/2,cy=size/2+4,R=size/2-(narrow?36:48);\n  const svg=el('svg',{viewBox:`0 0 ${size} ${h}`,role:'img','aria-label':'Widoczność',style:`width:${size}px;max-width:100%;flex:0 0 auto`});\n  const rr=v=>R*Math.sqrt(Math.max(0,Math.min(v,VMAX))/VMAX);\n  const ang=i=>-Math.PI/2+i*2*Math.PI/n,half=Math.PI/n;\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rr(v),cy+Math.sin(ang(i))*rr(v)];\n  const poly=a=>a.map((v,i)=>{const p=pt(i,v);return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join('')+'Z';\n  const wedge=(i,r)=>{const a0=ang(i)-half,a1=ang(i)+half;\n    return `M${cx},${cy}L${cx+Math.cos(a0)*r},${cy+Math.sin(a0)*r}A${r},${r} 0 0 1 ${cx+Math.cos(a1)*r},${cy+Math.sin(a1)*r}Z`};\n  /* godziny przed wschodem / po zachodzie (środek godziny) – szary wycinek, jak na innych wykresach */\n  const sr=hf(DATA.sunrise),ss=hf(DATA.sunset);\n  H.forEach((hv,i)=>{if(hv+.5<sr||hv+.5>ss)el('path',{d:wedge(i,R),fill:'var(--night)'},svg)});\n  /* strefy progów */\n  el('circle',{cx,cy,r:rr(5000),fill:'var(--warn)',opacity:.12},svg);el('circle',{cx,cy,r:rr(5000),fill:'none',stroke:'var(--warn)','stroke-width':1.5,opacity:.8},svg);\n  el('circle',{cx,cy,r:rr(1000),fill:'var(--crit)',opacity:.2},svg);el('circle',{cx,cy,r:rr(1000),fill:'none',stroke:'var(--crit)','stroke-width':1.5,opacity:.9},svg);\n  /* pierścienie i ramiona */\n  [1000,5000,10000,20000].forEach(v=>el('circle',{cx,cy,r:rr(v),fill:'none',stroke:v===20000?'var(--axis)':'var(--grid)','stroke-width':1,...(v<20000?{'stroke-dasharray':'3 3'}:{})},svg));\n  H.forEach((_,i)=>{const p=pt(i,VMAX);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'var(--grid)'},svg)});\n  /* rozrzut modeli i mediana */\n  el('path',{d:poly(V),fill:'var(--s1)','fill-opacity':.12,stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round'},svg);\n  if(band)H.forEach((_,i)=>{const lo=Math.min(VR.lo[i],VMAX),hi=Math.min(VR.hi[i],VMAX);if(rr(hi)-rr(lo)<2)return;\n    const a=ang(i),px=-Math.sin(a)*4,py=Math.cos(a)*4,[x0,y0]=pt(i,lo),[x1,y1]=pt(i,hi);\n    el('path',{d:`M${x0},${y0}L${x1},${y1}M${x0-px},${y0-py}L${x0+px},${y0+py}M${x1-px},${y1-py}L${x1+px},${y1+py}`,stroke:'var(--text2)','stroke-width':1.4,fill:'none',opacity:.7},svg)});\n  V.forEach((v,i)=>{const p=pt(i,v);el('circle',{cx:p[0],cy:p[1],r:narrow?3.5:4.5,fill:v<1000?'var(--crit)':v<5000?'var(--warn)':'var(--good)',stroke:'var(--surface)','stroke-width':1.5},svg)});\n  /* opisy pierścieni (na ukos, między ramionami) */\n  const la=-Math.PI/2+half;\n  [[1000,'1'],[5000,'5'],[10000,'10'],[20000,'20 km']].forEach(([v,t])=>{\n    const x=cx+Math.cos(la)*r \"M12 16v6\"/>',\n  cloud:'<path d=\"M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z\"/>',\n  week:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/><path d=\"M7 15h10\"/>',\n  day:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/><rect x=\"7.5\" y=\"13.5\" width=\"4\" height=\"4\" rx=\".6\"/>',\n  grid:'<rect width=\"18\" height=\"18\" x=\"3\" y=\"4\" rx=\"2\"/><path d=\"M16 2v4\"/><path d=\"M8 2v4\"/><path d=\"M3 10h18\"/>',\n  list:'<path d=\"M3 6h.01\"/><path d=\"M3 12h.01\"/><path d=\"M3 18h.01\"/><path d=\"M8 6h13\"/><path d=\"M8 12h13\"/><path d=\"M8 18h13\"/>'};\nconst ico=(k,c='ico')=>`<svg class=\"${c}\" viewBox=\"0 0 24 24\" aria-hidden=\"true\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\">${ICON[k]}<\/svg>`;\n\n/* ---- nagłówek: werdykt, najważniejsze liczby, łuk słońca z ocenami godzin ---- */\n(function hero(){\n  const MON=['stycznia','lutego','marca','kwietnia','maja','czerwca','lipca','sierpnia','września','października','listopada','grudnia'];\n  const DAYS=['niedziela','poniedziałek','wtorek','środa','czwartek','piątek','sobota'];\n  const COL={g:'var(--good)',y:'var(--warn)',r:'var(--crit)'};\n  const [dd,mm,yy]=DATA.dateLong.split(' ').pop().split('.').map(Number),dt=new Date(yy,mm-1,dd);\n  const S=DATA.series,Hr=DATA.hours;\n  const win=code=>{const o=[];let c=null;\n    Hr.forEach((h,i)=>{if(S.rate[i]===code){if(!c)c={a:h,b:h,w:[]};c.b=h;DATA.why[i].forEach(x=>{if(!c.w.includes(x))c.w.push(x)})}else if(c){o.push(c);c=null}});\n    if(c)o.push(c);\n    return o.map(x=>{let a=hh(x.a),b=hh(x.b+1);if(a<DATA.dawn)a=DATA.dawn;if(b>DATA.dusk)b=DATA.dusk;return{a,b,w:x.w}})};\n  const g=win('g'),y=win('y'),r=win('r');\n  const code=g.length?'g':y.length?'y':'r',best=code==='g'?g:code==='y'?y:[];\n  document.getElementById('hPlace').innerHTML ont-size:10px;':'')+'fill:'+wcol(D.gust[i]-3)},svg);gt.textContent=Math.round(D.gust[i]);\n    if(i%2===0||step>40){const t=el('text',{x:X(i),y:h-4,'text-anchor':'middle'},svg);t.textContent=String(hv).padStart(2,'0')}});\n  const cross=el('line',{x1:0,x2:0,y1:top,y2:top+gridH,stroke:'var(--text)','stroke-width':1.5,visibility:'hidden'},svg);crosses.push(Object.assign(cross,{_xs:H.map((_,i)=>X(i))}));\n  /* obszary podpowiedzi: komórka mapy → wartość na tej wysokości; reszta kolumny → cała godzina */\n  for(let i=0;i<H.length;i++){\n    for(let k=0;k<LEV.length;k++){const r=el('rect',{x:X(i)-step/2,y:rowY(k),width:step,height:rowH,fill:'transparent'},svg);\n      const v=windAt(LEV[k],i),extra=[[`Wiatr na ${LEV[k]} m`+(isModel(LEV[k])?' (mediana)':' (interp.)'),fmt(v)+' km/h',wcol(v)]];\n      const key='w'+LEV[k];\n      if(isModel(LEV[k]))MODELS.forEach(m=>{const mv=m.s[key]&&m.s[key][i];if(mv!=null)extra.push(['  '+m.name,fmt(mv)+' km/h',null,true])});\n      r.addEventListener('pointermove',e=>show(i,e,extra));r.addEventListener('pointerleave',hide);r.addEventListener('pointerdown',e=>show(i,e,extra))}\n    const r=el('rect',{x:X(i)-step/2,y:top+gridH,width:step,height:h-top-gridH,fill:'transparent'},svg);\n    r.addEventListener('pointermove',e=>show(i,e));r.addEventListener('pointerleave',hide);r.addEventListener('pointerdown',e=>show(i,e))}\n  card.appendChild(svg);document.getElementById('charts').appendChild(card);\n}\n/* ---- Widoczność: wykres radarowy ----\n   Ramię = godzina (od góry, zgodnie ze wskazówkami zegara). Odległość od środka = widoczność,\n   skala pierwiastkowa do 20 km, żeby progi 1 i 5 km były dobrze widoczne. */\nfunction visRadar(){\n  const VMAX=20000,V=D.vis,n=H.length;\n  const VR=MULTI()?mrange('vis'):null,band=VR&&VR.n>1;\n  let iMin=0;V.forEach((v,i)=>{if(v<V[iMin])iMin=i});\n  const card=document.createElement('section');card.className='card';\n  card.innerHTML=head('vis','Widoczność (km)',['min.',`${visTxt(V[iMin])} · ${hh(H[iMin])}`,lvl(V[iMin],5000,1000,1)])+\n    `<p>Ramię to godzina (od góry, zgodnie z zegarem). Im dalej od środka, tym lepiej widać – skala do 20 km.<\/p>`;\n  const sw=(bg,op,round)=>`<i style=\"width:12px;height:12px;border-radius:${round?'50%':'3px'};background:${bg};opacity:${op};vertical-align:-2px\"><\/i>`;\n  const dot=c=>`<i style=\"width:9px;height:9px;border-radius:50%;background:${c};border:1.5px solid var(--surface);box-shadow:0 0 0 1px var(--axis);vertical-align:-1px\"><\/i>`;\n  const lg=document.createElement('div');lg.className='legend';\n  lg.style.cssText='flex-direction:column;gap:9px;margin:0;flex:0 1 auto';\n  lg.innerHTML=[\n    `<span>${sw('var(--crit)',.45,1)}poniżej 1 km – lot odradzany<\/span>`,\n    `<span>${sw('var(--warn)',.4,1)}1–5 km – z uwagą<\/span>`,\n    `<span>${dot('var(--good)')}powyżej 5 km – dobrze<\/span>`,\n    `<span><i style=\"background:var(--s1)\"><\/i>${band?'mediana modeli':'prognoza'}<\/span>`,\n    ...(band?[`<span><svg width=\"16\" height=\"10\" style=\"display:inline-block;width:16px;vertical-align:-1px;margin-right:5px;overflow:visible\"><path d=\"M1 5H15M1 1V9M15 1V9\" stroke=\"var(--text2)\" stroke-width=\"1.4\" fill=\"none\"/><\/svg>rozrzut modeli (min–max)<\/span>`]:[]),\n    `<span>${sw('var(--night)',1,0)}przed wschodem / po zachodzie<\/span>`].join('');\n  /* radar po lewej, legenda po prawej; na wąskim ekranie legenda przechodzi pod wykres */\n  const narrow=W<640,size=narrow?Math.min(W,420):460,h=size+8,cx=size/2,cy=size/2+4,R=size/2-(narrow?36:48);\n  const svg=el('svg',{viewBox:`0 0 ${size} ${h}`,role:'img','aria-label':'Widoczność',style:`width:${size}px;max-width:100%;flex:0 0 auto`});\n  const rr=v=>R*Math.sqrt(Math.max(0,Math.min(v,VMAX))/VMAX);\n  const ang=i=>-Math.PI/2+i*2*Math.PI/n,half=Math.PI/n;\n  const pt=(i,v)=>[cx+Math.cos(ang(i))*rr(v),cy+Math.sin(ang(i))*rr(v)];\n  const poly=a=>a.map((v,i)=>{const p=pt(i,v);return(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)}).join('')+'Z';\n  const wedge=(i,r)=>{const a0=ang(i)-half,a1=ang(i)+half;\n    return `M${cx},${cy}L${cx+Math.cos(a0)*r},${cy+Math.sin(a0)*r}A${r},${r} 0 0 1 ${cx+Math.cos(a1)*r},${cy+Math.sin(a1)*r}Z`};\n  /* godziny przed wschodem / po zachodzie (środek godziny) – szary wycinek, jak na innych wykresach */\n  const sr=hf(DATA.sunrise),ss=hf(DATA.sunset);\n  H.forEach((hv,i)=>{if(hv+.5<sr||hv+.5>ss)el('path',{d:wedge(i,R),fill:'var(--night)'},svg)});\n  /* strefy progów */\n  el('circle',{cx,cy,r:rr(5000),fill:'var(--warn)',opacity:.12},svg);el('circle',{cx,cy,r:rr(5000),fill:'none',stroke:'var(--warn)','stroke-width':1.5,opacity:.8},svg);\n  el('circle',{cx,cy,r:rr(1000),fill:'var(--crit)',opacity:.2},svg);el('circle',{cx,cy,r:rr(1000),fill:'none',stroke:'var(--crit)','stroke-width':1.5,opacity:.9},svg);\n  /* pierścienie i ramiona */\n  [1000,5000,10000,20000].forEach(v=>el('circle',{cx,cy,r:rr(v),fill:'none',stroke:v===20000?'var(--axis)':'var(--grid)','stroke-width':1,...(v<20000?{'stroke-dasharray':'3 3'}:{})},svg));\n  H.forEach((_,i)=>{const p=pt(i,VMAX);el('line',{x1:cx,y1:cy,x2:p[0],y2:p[1],stroke:'var(--grid)'},svg)});\n  /* rozrzut modeli i mediana */\n  el('path',{d:poly(V),fill:'var(--s1)','fill-opacity':.12,stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round'},svg);\n  if(band)H.forEach((_,i)=>{const lo=Math.min(VR.lo[i],VMAX),hi=Math.min(VR.hi[i],VMAX);if(rr(hi)-rr(lo)<2)return;\n    const a=ang(i),px=-Math.sin(a)*4,py=Math.cos(a)*4,[x0,y0]=pt(i,lo),[x1,y1]=pt(i,hi);\n    el('path',{d:`M${x0},${y0}L${x1},${y1}M${x0-px},${y0-py}L${x0+px},${y0+py}M${x1-px},${y1-py}L${x1+px},${y1+py}`,stroke:'var(--text2)','stroke-width':1.4,fill:'none',opacity:.7},svg)});\n  V.forEach((v,i)=>{const p=pt(i,v);el('circle',{cx:p[0],cy:p[1],r:narrow?3.5:4.5,fill:v<1000?'var(--crit)':v<5000?'var(--warn)':'var(--good)',stroke:'var(--surface)','stroke-width':1.5},svg)});\n  /* opisy pierścieni (na ukos, między ramionami) */\n  const la=-Math.PI/2+half;\n  [[1000,'1'],[5000,'5'],[10000,'10'],[20000,'20 km']].forEach(([v,t])=>{\n    const x=cx+Math.cos(la)*rr(v)+3,y=cy+Math.sin(la)*rr(v)+(v===VMAX?11:-3);  /* 20 km – od środka, żeby nie wchodziło na godziny */\n    const tx=el('text',{x,y,style:'font-size:10px',...(v===5000||v===1000?{class:'lbl'}:{})},svg);tx.textContent=t});\n  /* godzina + wartość na zewnątrz */\n  H.forEach((hv,i)=>{const a=ang(i),c=Math.cos(a),s=Math.sin(a),lr=R+(narrow?13:18);\n    const x=cx+c*lr,y=cy+s*lr+(s>0.3?8:s<-0.3?-4:3),anchor=c>0.25?'start':c<-0.25?'end':'middle';\n    const t1=el('text',{x,y,'text-anchor':anchor,class:'lbl',style:narrow?'font-size:10px':''},svg);t1.textContent=String(hv).padStart(2,'0');\n    const v=V[i],t2=el('text',{x,y:y+(narrow?11:13),'text-anchor':anchor,style:'font-size:'+(narrow?'9px':'10.5px')+(v<5000?';fill:'+(v<1000?'var(--crit)':'var(--text2)')+';font-weight:600':'')},svg);\n    t2.textContent=v>=VMAX?'>20':fmt(v/1000,v<10000?1:0)});\n  /* obszary podpowiedzi: wycinek na godzinę */\n  H.forEach((_,i)=>{const r=el('path',{d:wedge(i,R+30),fill:'transparent'},svg);\n    const extra=[['Widoczność (mediana)',visTxt(V[i]),'var(--s1)']];\n    MODELS.forEach(m=>{const mv=m.s.vis&&m.s.vis[i];if(mv!=null)extra.push(['  '+m.name,visTxt(mv),null,true])});\n    r.addEventListener('pointermove',e=>show(i,e,extra));r.addEventListener('pointerleave',hide);r.addEventListener('pointerdown',e=>show(i,e,extra))});\n  const wrap=document.createElement('div');\n  wrap.style.cssText='display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:12px 40px;padding-bottom:8px';\n  wrap.append(svg,lg);card.appendChild(wrap);document.getElementById('charts').appendChild(card);\n}\nfunction render(){\nif(MULTI())BASER=mrange('base',baseOf);\ndims();document.getElementById('charts').innerHTML='';crosses.length=0;\nwindHeatmap();\n\nvisRadar();\n\n/* siatka 2×2: temperatura, opady, chmury, Kp (na wąskim ekranie jedna kolumna) */\nconst CH=document.getElementById('charts'),g2=document.createElement('div');g2.className document.title=F.title;
const main=document.getElementById('main');
let loaded=0;
function fit(f){
  const d=f.contentDocument;if(!d||!d.body)return;
  const h=Math.ceil(d.body.getBoundingClientRect().height);  // treść, nie okno ramki – żeby umiała się też zmniejszyć
  if(h&&!f.classList.contains('off'))f.style.height=h+'px';

function mk(item,parent){
  const f=document.createElement('iframe');
  f.title=item.label;f.setAttribute('loading','eager');
  f.addEventListener('load',()=>{
    try{new ResizeObserver(()=>fit(f)).observe(f.contentDocument.body)}catch(e){}
    fit(f);
    if(++loaded===F.items.length)requestAnimationFrame(()=>{F.items.forEach((_,i)=>fit(frames[i]));window.__framesReady=true});
  });
  f.srcdoc=item.html;parent.appendChild(f);return f;
}
const frames=[];
if(F.mode==='tabs'){
  const bar=document.createElement('nav');bar.className='tabs';bar.innerHTML='<div role="tablist"></div>';main.appendChild(bar);
  const stage=document.createElement('div');stage.className='stage';main.appendChild(stage);
  F.items.forEach((it,i)=>{
    const b=document.createElement('button');b.role='tab';b.textContent=it.label;b.setAttribute('aria-selected',i===0);
    b.onclick=()=>select(i);bar.firstChild.appendChild(b);
    const f=mk(it,stage);if(i)f.classList.add('off');frames.push(f);
  });
  function select(i){
    [...bar.firstChild.children].forEach((b,j)=>b.setAttribute('aria-selected',j===i));
    frames.forEach((f,j)=>{f.classList.toggle('off',j!==i);if(j===i)fit(f)});
    scrollTo({top:0});
  }
}else if(F.mode==='week'){
  // week overview (items[0]) stays on top; below it one day page at a time (items[1..]),
  // switched by clicking the day arcs in the overview (postMessage 'dw-day' from the week frame)
  frames.push(mk(F.items[0],main));
  const s=document.createElement('div');s.className='sep';s.innerHTML='<hr>';main.appendChild(s);
  const stage=document.createElement('div');stage.className='stage';main.appendChild(stage);
  F.items.slice(1).forEach((it,i)=>{const f=mk(it,stage);if(i)f.classList.add('off');frames.push(f)});
  addEventListener('message',e=>{
    if(e.source!==frames[0].contentWindow||!e.data||e.data.type!=='dw-day')return;
    const i=e.data.i;if(!(i>=0&&i<frames.length-1))return;
    frames.slice(1).forEach((f,j)=>{f.classList.toggle('off',j!==i);if(j===i)fit(f)});
    stage.scrollIntoView({behavior:'smooth',block:'start'});
  });
}else{
  F.items.forEach((it,i)=>{
    if(i){const s=document.createElement('div');s.className='sep';s.innerHTML='<hr>';main.appendChild(s)}
    frames.push(mk(it,main));
  });
}
